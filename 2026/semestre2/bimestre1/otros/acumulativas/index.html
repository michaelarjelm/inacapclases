<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Calificaciones - INACAP</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Login -->
        <div id="login-section" class="card fade-in">
            <div class="logo">
                <img src="https://www.inacap.cl/web/template-aplicaciones/img/logo-inacap.png" alt="INACAP Logo">
            </div>
            <h2>Portal de Alumnos</h2>
            <p>Ingresa tu RUT para consultar tus notas acumulativas.</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="rut">RUT (ej: 12345678-9)</label>
                    <input type="text" id="rut" placeholder="12345678-K" required>
                </div>
                <button type="submit" id="login-btn" class="btn-primary">Consultar</button>
            </form>
            <div id="error-msg" class="error hidden"></div>
        </div>

        <!-- Selector de modulo (alumnos con mas de una seccion) -->
        <div id="selector-section" class="card fade-in hidden">
            <h2 id="selector-name">---</h2>
            <p>Estás inscrito en más de un módulo. ¿De cuál quieres ver tus notas?</p>
            <div class="course-list" id="course-list"></div>
            <button id="selector-back-btn" class="btn-secondary">Volver</button>
        </div>

        <!-- Notas -->
        <div id="dashboard-section" class="hidden">
            <div class="card fade-in">
                <div class="header">
                    <div>
                        <h2 id="student-name">---</h2>
                        <p id="student-module" style="color: var(--text-muted); font-weight: 600; margin-bottom: 5px;">Módulo: ---</p>
                        <p id="student-section" class="badge">Sección: ---</p>
                    </div>
                    <div class="header-actions">
                        <button id="back-btn" class="btn-secondary hidden">Volver</button>
                        <button id="logout-btn" class="btn-secondary">Cerrar Sesión</button>
                    </div>
                </div>

                <div class="grades-grid" id="grades-container"></div>

                <div class="summary-section">
                    <div class="summary-card">
                        <span class="label">Promedio Real</span>
                        <span id="avg-real" class="value">-</span>
                    </div>
                    <div class="summary-card highlight">
                        <span class="label">Promedio Final (n-2)</span>
                        <span id="avg-final" class="value">-</span>
                    </div>
                </div>

                <div class="footer-note" id="footer-note"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
